[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxpack"
version = "0.1.0"
description = "Pack a codebase into an LLM-ready context bundle: gitignore-aware, token-budgeted, secret-scrubbed."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Tirth Doshi" }]
keywords = ["cli", "llm", "developer-tools", "prompt-engineering", "context"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.1",
  "pathspec>=0.12",
  "tiktoken>=0.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/DoshiTirth/ctxpack"
Issues = "https://github.com/DoshiTirth/ctxpack/issues"

[project.scripts]
ctxpack = "ctxpack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxpack"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
